; The Vault - ESP32 firmware
;
; Board: ESP32-S2-DevKitM-1. PlatformIO has no board entry for it, so we use
; the Saola-1 definition: same ESP32-S2 chip, 4 MB flash, USB-UART bridge.
;
;   pio run -t upload            build and flash
;   pio device monitor           open the debug console (115200)
;   pio test -e native           run protocol unit tests on the laptop

[platformio]
default_envs = esp32s2

[env:esp32s2]
platform = espressif32 @ 8.0.0
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Wi-Fi + HTTPS need more than the default 1.25 MB app slot; no OTA used.
board_build.partitions = huge_app.csv
build_flags =
    -Wall
    ; Bound Wi-Fi RAM before Arduino starts the prebuilt ESP-IDF driver.
    -Wl,--wrap=esp_wifi_init
    -I../../Project_Secrets
lib_deps =
    symlink://../common/vault_protocol
    bblanchon/ArduinoJson@^7.4.2

; Host build for unit-testing the shared protocol code (no board needed).
[env:native]
platform = native
lib_deps =
    symlink://../common/vault_protocol
