; Test-only PlatformIO configuration. Invoke with -d esp32 -c esp32/platformio.ci.ini.
[platformio]
build_dir = ../build-ci/protocol/build
libdeps_dir = ../build-ci/protocol/libdeps
[env:native]
platform = native@1.2.1
lib_deps =
    symlink://../common/vault_protocol
    throwtheswitch/Unity@2.6.1
test_framework = unity
build_flags = -Wall -Wextra -Werror -fsanitize=address,undefined -g
